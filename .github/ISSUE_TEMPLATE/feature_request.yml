name: Feature request
description: Suggest a new feature or improvement.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What would you like to do, or what is difficult today?
      placeholder: I want to organise my bank tabs by activity.
    validations:
      required: true
  - type: textarea
    id: proposed-behavior
    attributes:
      label: Proposed behavior
      description: What should the game or app do instead? A plain description is enough.
      placeholder: Let me save and name a set of bank tab layouts.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any other ways to solve this, or workarounds you use today. Optional.
      placeholder: I currently rearrange tabs by hand each time.
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Supporting links, screenshots or context
      description: Optional links, screenshots or context that help explain the request. No recordings or sources are required.
      render: text
    validations:
      required: false
