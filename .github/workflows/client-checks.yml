name: Client checks

on:
    pull_request:
        paths: ['client/**', '.github/workflows/client-checks.yml']

permissions:
    contents: read

jobs:
    check:
        if: github.repository == 'RSPSApp/tsps'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 24
            - run: corepack enable
            - run: yarn install --immutable
              working-directory: client
            - run: yarn typecheck
              working-directory: client
            - run: yarn test engine-event-hooks widget-action-dispatch widget-primary-op widget-script-inventory widget-menu-use menu-click menu-swapper widget-drag map-square-cache runelite
              working-directory: client
