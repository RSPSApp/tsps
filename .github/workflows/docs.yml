name: Deploy Docs

on:
    pull_request:
        branches: [main]
        paths: ['docs/**', '.github/workflows/docs.yml']
    push:
        branches: [main]
        paths: ['docs/**', '.github/workflows/docs.yml']

permissions:
    contents: read

concurrency:
    group: ${{ github.event_name == 'pull_request' && format('pages-pr-{0}', github.event.pull_request.number) || 'pages' }}
    cancel-in-progress: false

jobs:
    build:
        if: github.repository == 'RSPSApp/tsps'
        permissions:
            contents: read
            pages: read
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
            - uses: actions/configure-pages@v5
              id: pages
            - run: corepack enable
            - run: corepack yarn install --frozen-lockfile
              working-directory: docs
            - run: corepack yarn build --base "${{ steps.pages.outputs.base_path }}/"
              working-directory: docs
            - uses: actions/upload-pages-artifact@v3
              if: github.event_name == 'push'
              with:
                  path: docs/.vitepress/dist

    deploy:
        if: github.repository == 'RSPSApp/tsps' && github.event_name == 'push'
        permissions:
            pages: write
            id-token: write
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        needs: build
        runs-on: ubuntu-latest
        steps:
            - id: deployment
              uses: actions/deploy-pages@v4
