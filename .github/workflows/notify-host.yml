name: Deploy browser host

# Every merge to main rebuilds the host server snapshot (rsps-website/host) and redeploys it.
on:
    push:
        branches: [main]

jobs:
    notify:
        if: github.repository == 'RSPSApp/tsps'
        runs-on: ubuntu-latest
        steps:
            - run: gh api repos/tobywisener/rsps-website/dispatches -f event_type=tsps-main
              env:
                  GH_TOKEN: ${{ secrets.HOST_DISPATCH_TOKEN }}
