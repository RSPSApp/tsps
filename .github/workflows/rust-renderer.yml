name: Rust Renderer

on:
  push:
    branches:
      - main
      - feature/rust-renderer-core
    paths:
      - "client/rust-renderer/**"
      - ".github/workflows/rust-renderer.yml"
  pull_request:
    paths:
      - "client/rust-renderer/**"
      - ".github/workflows/rust-renderer.yml"

jobs:
  renderer:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client/rust-renderer
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt,clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Native tests
        run: cargo test --all-targets
      - name: Native clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: WASM check
        run: cargo check --target wasm32-unknown-unknown
