[package]
name = "elvarg-rust-renderer"
version = "0.1.0"
edition = "2024"
description = "Pure Rust/WASM rendering engine for the Elvarg OSRS web client"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
console_error_panic_hook = "0.1"
web-sys = { version = "0.3", features = [
    "HtmlCanvasElement",
    "WebGl2RenderingContext",
    "WebGlBuffer",
    "WebGlProgram",
    "WebGlShader",
    "WebGlUniformLocation",
    "WebGlVertexArrayObject",
] }

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
panic = "abort"
