</style></head><body><header><a href="/">← World config</a><h1>Bot routine editor</h1><button id="import">Import JSON</button><input id="import-file" type="file" accept="application/json,.json" hidden><button id="export">Export JSON</button><button id="save">Save activities</button></header><div class="toolbar"><label for="activities">Bot routine</label><div class="activity-picker"><input id="activities" autocomplete="off" placeholder="Select or rename routine" title="Choose a saved routine from the dropdown or type a new name to rename the selected routine" role="combobox" aria-autocomplete="list" aria-haspopup="listbox" aria-controls="activity-options" aria-expanded="false"><button id="activity-toggle" class="activity-picker-toggle" type="button" aria-label="Show saved bot routines" aria-expanded="false" title="Show saved bot routines">▾</button><div id="activity-options" class="routine-options" role="listbox" aria-label="Saved bot routines" hidden></div></div><button id="new">New routine</button><button id="delete" disabled>Delete routine</button><button id="convert" hidden>Convert saved activity</button></div><section class="block-palette" aria-label="Add a bot routine block"><div class="palette-heading"><div><strong>Add a block</strong><small>Browse a category or search every block; click one to add it to this routine.</small></div><input id="block-search" type="search" aria-label="Search all bot routine blocks" placeholder="Search all blocks"></div><div id="category-list" class="category-list" role="tablist" aria-label="Block categories"></div><div id="block-list" class="block-list" role="tabpanel" aria-label="Available blocks"></div></section><div class="status-toolbar"><div class="status-line"><div id="status" class="status" role="status"></div><div id="canvas-controls" class="canvas-controls" role="group" aria-label="Graph zoom controls"><button id="zoom-out" type="button" aria-label="Zoom out" title="Zoom out">−</button><output id="zoom-label" aria-live="p <script>
'use strict';
const $=id=>document.getElementById(id);let all=[],selectedActivity=null,selectedNode=null,link=null,hash='',dirty=false;
const titles={start:'Start',end:'End',if:'If / else',switch:'Switch',interrupt:'Event trigger',disarm:'Disarm event triggers',resume:'Resume routine',agent:'AI agent decision',wait:'Wait',fish:'Fish',wander:'Wander',trainCombat:'Train combat',walkTo:'Walk to tile',equipTool:'Equip tool',interactObject:'Gather',dropItems:'Drop items',bank:'Bank items',sellItems:'Sell items',cook:'Cook food',lightFire:'Burn logs',ensureItem:'Get tinderbox',smelt:'Smelt ore'};
const blockCategories={conditions:[['if','If / else'],['switch','Switch']],interrupts:[['interrupt','Event trigger'],['disarm','Disarm event triggers'],['resume','Resume routine']],ai:[['agent','AI agent decision']],movement:[['walkTo','Walk to tile'],['wander','Wander']],gathering:[['tree','Chop trees'],['rock','Mine rocks'],['fish','Fish']],combat:[['trainCombat','Train combat (default preset)']],items:[['equipTool','Equip tool'],['ensureItem','Get tinderbox'],['dropItems','Drop items'],['bank','Bank items'],['sellItems','Sell items']],production:[['cook','Cook food'],['lightFire','Burn logs'],['smelt','Smelt ore']],flow:[['wait','Wait'],['end','End']]};
const categoryNames={conditions:'Conditions',interrupts:'Event triggers',ai:'AI agent',movement:'Movement',gathering:'Gathering',combat:'Combat',items:'Items & banking',production:'Production',flow:'Flow & timing'};
const blockDescriptions={if:'Route using game conditions',switch:'Choose the first matching rule',interrupt:'Watch for a condition and branch away',disarm:'Clear every armed event trigger',resume:'Restart the interrupted node',agent:'Choose a route with configured AI',walkTo:'Walk to a map tile',wander:'Roam around the current area; tune radius and pause',tree:'Gather logs from a tree',rock:'Mine ore from a rock',fish:'Fish at a nearby spot',trainCombat:'Train using the default preset',equipTool:'Equip the best available tool',ensureItem:'Provision a tinderbox',dropItems:'Drop selected items',bank:'Deposit selected items',sellItems:'Sell selected items',cook:'Cook food in inventory',lightFire:'Burn logs into a fire',smelt:'Smelt ore into bars',wait:'Pause for a timed delay',end:'Finish this routine run'};
const blockGlyphs={if:'IF',switch:'↔',interrupt:'!',disarm:'×',resume:'↶',agent:'AI',walkTo:'→',wander:'↝',tree:'T',rock:'R',fish:'F',trainCombat:'⚔',equipTool:'E',ensureItem:'+',dropItems:'↓',bank:'▣',sellItems:'$',cook:'C',lightFire:'♨',smelt:'S',wait:'Ⅱ',end:'■'};
let selectedCategory='conditions';
let zoom=1,inspectorWidth=320,resizingInspector=false;
function applyZoom(value){const viewport=$('viewport'),old=zoom,next=Math.max(.4,Math.min(2,Math.round(value*10)/10));if(next===old)return;const anchorX=viewport.clientWidth/2,anchorY=viewport.clientHeight/2,logicalX=(viewport.scrollLeft+anchorX)/old,logicalY=(viewport.scrollTop+anchorY)/old;zoom=next;$('canvas-scene').style.width=`${3000*zoom}px`;$('canvas-scene').style.height=`${2000*zoom}px`;$('canvas').style.transform=`scale(${zoom})`;$('zoom-label').value=`${Math.round(zoom*100)}%`;$('zoom-out').disabled=zoom<=.4;$('zoom-in').disabled=zoom>=2;requestAnimationFrame(()=>{viewport.scrollLeft=logicalX*zoom-anchorX;viewport.scrollTop=logicalY*zoom-anchorY})}
function setInspectorWidth(value,persist=true){inspectorWidth=Math.max(240,Math.min(700,Math.round(value)));$('workspace').style.setProperty('--inspector-width',`${inspectorWidth}px`);$('inspector-resizer').setAttribute('aria-valuenow',String(inspectorWidth));if(persist)try{localStorage.setItem('bot-routine-inspector-width',String(inspectorWidth))}catch{}}
function addBlock(kind){const activity=current();if(!activity)return;const node=makeNode(kind);activity.graph.nodes.push(node);selectedNode=node.id;changed();render()}
function populateBlocks(){const categories=$('category-list'),list=$('block-list'),search=$('block-search'),query=search.value.trim().toLowerCase();categories.replaceChildren();categories.classList.toggle('is-searching',!!query);for(const [key,blocks]of Object.entries(blockCategories)){const tab=btn('',()=>{selectedCategory=key;if(query)search.value='';populateBlocks()});tab.className='category-tab';tab.id=`category-${key}`;tab.setAttribute('role','tab');const selected=!query&&key===selectedCategory;tab.setAttribute('aria-selected',String(selected));tab.tabIndex=key===selectedCategory?0:-1;tab.append(el('span',categoryNames[key]));const count=el('span',String(blocks.length));count.className='category-tab-count';tab.append(count);tab.onkeydown=event=>{if(!['ArrowLeft','ArrowRight'].includes(event.key))return;event.preventDefault();const keys=Object.keys(blockCategories),index=keys.indexOf(key),next=keys[(index+(event.key==='ArrowRight'?1:-1)+keys.length)%keys.length];selectedCategory=next;populateBlocks();categories.querySelector(`#category-${next}`)?.focus()};categories.append(tab)}const active=categories.querySelector(`#category-${selectedCategory}`);if(query){list.removeAttribute('aria-labelledby');list.setAttribute('aria-label','Search results across all categories')}else{list.setAttribute('aria-labelledby',active?.id??'');list.removeAttribute('aria-label')}const matches=query?Object.entries(blockCategories).flatMap(([category,blocks])=>blocks.map(([kind,name])=>({kind,name,category}))).filter(({kind,name,category})=>`${name} ${blockDescriptions[kind]??''} ${categoryNames[category]}`.toLowerCase().includes(query)):(blockCategories[selectedCategory]??[]).map(([kind,name])=>({kind,name,category:selectedCategory}));list.replaceChildren(...matches.map(({kind,name,category})=>{const tile=btn('',()=>addBlock(kind));tile.className='block-tile';tile.setAttribute('aria-label',`Add ${name} from ${categoryNames[category]}`);const icon=el('span',blockGlyphs[kind]??'•');icon.className='block-tile-icon';icon.setAttribute('aria-hidden','true');const copy=el('span');copy.className='block-tile-copy';copy.append(el('strong',name),el('small',query?`${categoryNames[category]} · ${blockDescriptions[kind]??''}`:blockDescriptions[kind]??''));tile.append(icon,copy);return tile}));if(!matches.length){const empty=el('div',query?'No blocks match across any category.':'No blocks in this category.');empty.className='block-empty';list.append(empty)}}
const el=(tag,text)=>{const n=document.createElement(tag);if(text!==undefined)n.textContent=text;return n};
function btn(text,fn){const n=el('button',text);n.type='button';n.onclick=fn;return n}function changed(message='Unsaved changes'){dirty=true;$('status').textContent=message}function current(){return all.find(a=>a.id===selectedActivity&&a.graph)}
function setRoutineMenu(open){const options=$('activity-options'),input=$('activities'),toggle=$('activity-toggle');options.hidden=!open;input.setAttribute('aria-expanded',String(open));toggle.setAttribute('aria-expanded',String(open))}
function renderRoutineOptions(query=''){const options=$('activity-options'),normalized=String(query).trim().toLowerCase(),entries=all.filter(entry=>entry.graph&&entry.id.toLowerCase().includes(normalized));options.replaceChildren(...entries.map(entry=>{const option=btn(entry.id,()=>selectRoutine(entry.id));option.className='routine-option';option.setAttribute('role','option');option.setAttribute('aria-selected',String(entry.id===selectedActivity));option.onmousedown=event=>event.preventDefault();return option}));if(!entries.length){const empty=el('div','No saved bot routines match.');empty.className='routine-options-empty';empty.setAttribute('role','option');empty.setAttribute('aria-disabled','true');options.append(empty)}}
function selectRoutine(id){const activity=all.find(entry=>entry.graph&&entry.id===id);if(!activity)return;selectedActivity=activity.id;selectedNode=null;link=null;$('activities').value=activity.id;setRoutineMenu(false);$('activities').focus();render()}
function nextId(){return 'n'+Math.random().toString(36).slice(2,11)}
function newGraph(){let n=1;while(all.some(a=>a.id==='custom_bot_routine_'+n))n++;const a={id:'custom_bot_routine_'+n,repeat:false,graph:{nodes:[{id:'start',kind:'start',x:70,y:100,setup:{location:null,skills:{},inventory:[],equipment:[]}},{id:'end',kind:'end',x:620,y:100}],edges:[{from:'start',port:'next',to:'end'}]}};all.push(a);selectedActivity=a.id;selectedNode='start';changed('New bot routine: add blocks, then connect each output to its next step.');render()}
